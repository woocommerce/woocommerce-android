
// Only run build scan on CI builds.
if (gradle.ext.isCi) {
    develocity {
        buildScan {
            termsOfUseUrl = 'https://gradle.com/terms-of-service'
            termsOfUseAgree = 'yes'
            tag 'CI'
            publishing.onlyIf { true }
            uploadInBackground = false
        }
    }
} else {
    develocity {
        buildScan {
            server="https://scans.gradle.com/"
            termsOfUseUrl = 'https://gradle.com/terms-of-service'
            termsOfUseAgree = 'yes'
        }
    }
}
