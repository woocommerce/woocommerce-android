build:
  maxIssues: 0

complexity:
  LargeClass:
    excludes: [ '**/test/**' ]
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: [ 'Inject', 'Composable' ]
  TooManyFunctions:
    active: false
  LongMethod:
    ignoreAnnotated: [ 'Composable' ]

formatting:
  active: true
  autoCorrect: true
  excludes: ['**/login/**']
  AnnotationOnSeparateLine:
    excludes: ['**/fluxc/**']
  ChainWrapping:
    excludes: ['**/fluxc/**']
  Indentation:
    active: true
    autoCorrect: true
    excludes: ['**/fluxc/**']
  MaximumLineLength:
    active: true
    excludes: ['**/fluxc/**']
    ignoreBackTickedIdentifier: true
  MultiLineIfElse:
    excludes: ['**/fluxc/**']
  Wrapping:
    excludes: ['**/fluxc/**']
  ArgumentListWrapping:
    excludes: ['**/fluxc/**']
  SpacingAroundComma:
    excludes: ['**/fluxc/**']
  SpacingBetweenDeclarationsWithAnnotations:
    excludes: ['**/fluxc/**']


style:
  ReturnCount:
    max: 4
  UnnecessaryAbstractClass:
    active: true
    ignoreAnnotated: [ 'Module' ]
  MagicNumber:
    ignoreEnums: true
    ignorePropertyDeclaration: true
    ignoreAnnotated: [ 'Composable' ]
  UnusedPrivateMember:
    # WooPosPreview is a meta-annotation that wraps @Preview; detekt does not follow meta-annotations transitively.
    ignoreAnnotated: [ 'Preview', 'PreviewLightDark', 'LightDarkThemePreviews', 'OrientationPreviews', 'FontScalePreviews', 'LayoutDirectionPreviews', 'WooPosPreview' ]
  MaxLineLength:
    active: false

potential-bugs:
  active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true

naming:
  FunctionNaming:
    ignoreAnnotated: [ 'Composable' ]
