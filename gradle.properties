org.gradle.jvmargs=-Xmx8g
ksp.allow.all.target.configuration=false

# Enables Gradle Build Cache - https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.enableJetifier=false

android.nonTransitiveRClass=true

# Opt out of AGP 9 new DSL temporarily. Required because protobuf and other
# third-party plugins still reference BaseExtension.
# TODO: Remove once google-protobuf-plugin and other plugins support AGP 9 new DSL.
android.newDsl=false

# Dependency Analysis Plugin
dependency.analysis.android.ignored.variants=release,vanillaDebug,vanillaRelease,wasabiDebug,wasabiRelease,jalapenoRelease

# https://issuetracker.google.com/issues/259523353#comment21
android.experimental.enableTestFixturesKotlinSupport=true
