android {
    namespace = "com.woocommerce.android.aiassistant"

    defaultConfig {
        minSdkVersion gradle.ext.minSdkVersion
        targetSdkVersion gradle.ext.targetSdkVersion
        compileSdk = gradle.ext.compileSdkVersion
    }

    compileOptions {
        sourceCompatibility = libs.versions.java.get()
        targetCompatibility = libs.versions.java.get()
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    lint {
        // The lint detector expects metadata version 2.0.0 but the project uses 2.1.0
        // This can be re-enabled once the compose lint library supports newer metadata versions
        disable "FlowOperatorInvokedInComposition"
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    tasks.withType(Test).configureEach {
        systemProperty "wooAiSmokeRunLive", project.findProperty("wooAiSmokeRunLive")?.toString() ?: "false"
    }

    sourceSets {
        test.resources.srcDirs += 'src/test/resources'
        testDebug.java.srcDirs += 'src/testDebug/kotlin'
        testDebug.resources.srcDirs += 'src/testDebug/resources'
    }
}

android.buildTypes.all { buildType ->
    (secretProperties + developerProperties).each { property ->
        if (property.key in ["wc.oauth.app_id", "wc.oauth.app_secret"]) {
            buildType.buildConfigField "String", property.key.replace("wc.", "").replace(".", "_").toUpperCase(),
                    "\"${property.value}\""
        }
    }
}

