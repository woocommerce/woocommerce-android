# Used explicitly by start_code_freeze; GitHub release changelogs keep their full PR list.
changelog:
  exclude:
    labels:
      - 'impact: internal'
      - 'Releases'
      - 'status: feature-flagged'
  categories:
    - title: Android Wear
      labels:
        - 'feature: android wear'
    - title: Changes
      labels:
        - '*'
