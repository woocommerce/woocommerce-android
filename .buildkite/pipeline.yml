steps:
  - label: "android · v7 AMI · Ruby, Bundler, fastlane, Woo unit tests"
    agents:
      queue: android
      aws:ami-id: ami-0db49da8f2bcc776d
    plugins: [$CI_TOOLKIT]
    command: |
      set -eu
      buildkite-agent --version | tee /dev/stderr | grep -q 'version 4\.' || { echo "FAIL: expected agent 4.x"; exit 1; }
      ruby -ropenssl -rpsych -rzlib -e 'puts RUBY_DESCRIPTION; abort "FAIL: expected Ruby 3.4.9" unless RUBY_VERSION == "3.4.9"'
      RBENV_VERSION=3.4.13 ruby -ropenssl -rpsych -rzlib -e 'puts RUBY_DESCRIPTION; abort "FAIL: expected Ruby 3.4.13" unless RUBY_VERSION == "3.4.13"'
      if RBENV_VERSION=3.2.2 ruby -v 2>/dev/null; then echo "FAIL: Ruby 3.2.2 should be gone from this AMI"; exit 1; fi
      echo "OK: Ruby 3.2.2 absent"
      install_gems
      bundle exec fastlane --version
      ./gradlew :WooCommerce:testJalapenoDebugUnitTest
    artifact_paths:
      - "WooCommerce/build/test-results/testJalapenoDebugUnitTest/TEST-*.xml"
