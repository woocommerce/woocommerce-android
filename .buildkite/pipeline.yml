steps:
  - label: "Verify Android v4 API checkout and release pipeline dry run"
    key: verify-release
    if: build.source == "api" && build.env("ANDROID_V4_PROBE") == "release"
    agents:
      queue: android-staging
      aws:ami-id: ami-0db49da8f2bcc776d
    plugins: [$CI_TOOLKIT]
    command: bash .buildkite/commands/staging-v4-probe.sh release
    timeout_in_minutes: 15

  - label: "Verify Android v4 cancellation cleanup"
    key: verify-cancel
    if: build.source == "api" && build.env("ANDROID_V4_PROBE") == "cancel"
    agents:
      queue: android-staging
      aws:ami-id: ami-0db49da8f2bcc776d
    plugins: [$CI_TOOLKIT]
    command: bash .buildkite/commands/staging-v4-probe.sh cancel
    timeout_in_minutes: 10
