steps:
  - block: "Run after the Android staging stack is deployed"

  - label: "Android staging · Ruby 3.4.9 · Woo unit tests"
    agents:
      queue: android-staging
      aws:ami-id: ami-0db49da8f2bcc776d
    plugins: [$CI_TOOLKIT]
    command: |
      set -eu
      buildkite-agent --version
      ruby -ropenssl -rpsych -rzlib -e 'puts RUBY_DESCRIPTION; abort "Unexpected Ruby version" unless RUBY_VERSION == "3.4.9"'
      install_gems
      bundle exec fastlane --version
      ./gradlew :WooCommerce:testJalapenoDebugUnitTest
    artifact_paths:
      - "WooCommerce/build/test-results/testJalapenoDebugUnitTest/TEST-*.xml"
