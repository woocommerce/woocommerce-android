# Smoke Test: Hub Menu - Payments
# P2 ref: Hub menu > Payments (Enable/Disable Pay in Person, Order Card Reader, etc.)
#
# Verifies:
#   - Payments section accessible from More Menu
#   - Pay in Person toggle visible
#   - Order Card Reader option visible
#   - Card Reader Manuals option visible
appId: com.woocommerce.android.dev
name: "Hub Menu - Payments"
tags:
  - smoke
  - payments
  - hub_menu
---
# Reuse the logged-in session — login flows run first and leave the
# app authenticated. See subflows/ensure_logged_in.yaml.
- runFlow:
    file: ../subflows/ensure_logged_in.yaml

# Navigate to More Menu
- runFlow:
    file: ../subflows/navigate_to_more_menu.yaml

# Find and tap Payments
- scrollUntilVisible:
    element: "Payments"
    direction: DOWN
    timeout: 15000
    label: "Scroll to Payments in hub menu"

- tapOn: "Payments"

# Wait for Payments screen to load
- extendedWaitUntil:
    visible: "Pay in Person"
    timeout: 15000

- takeScreenshot: hub_payments_screen

# Scroll to see all payment options
- scroll

- takeScreenshot: hub_payments_scrolled

# Look for Order Card Reader
- runFlow:
    when:
      visible: "Order Card Reader"
    commands:
      - tapOn: "Order Card Reader"
      - takeScreenshot: hub_payments_order_reader
      - back

# Look for Card Reader Manuals
- scrollUntilVisible:
    element: "Card Reader Manuals"
    direction: DOWN
    timeout: 10000
    label: "Scroll to Card Reader Manuals"
    optional: true

- runFlow:
    when:
      visible: "Card Reader Manuals"
    commands:
      - tapOn: "Card Reader Manuals"
      - takeScreenshot: hub_payments_manuals
      - back

# Go back
- back
