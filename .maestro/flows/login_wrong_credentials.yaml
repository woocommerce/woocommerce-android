# Smoke Test: Login - Wrong credentials
# P2 ref: Login > Wrong credentials
appId: com.woocommerce.android.dev
name: "Login - Wrong credentials error"
tags:
  - smoke
  - login
env:
  WOO_STORE_URL: ${WOO_STORE_URL}
  WOO_EMAIL: ${WOO_EMAIL}
---
- launchApp:
    clearState: true

# Wait for app to finish loading after clearState
- extendedWaitUntil:
    visible: ".*Skip.*|.*Enter your store address.*|.*Log in.*"
    timeout: 30000

# Skip carousel if shown
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

# Enter store address
- extendedWaitUntil:
    visible:
      id: "button_login_store"
    timeout: 15000
- tapOn:
    id: "button_login_store"

- extendedWaitUntil:
    visible:
      id: "input"
    timeout: 10000
- tapOn:
    id: "input"
- inputText: ${WOO_STORE_URL}
- tapOn:
    id: "bottom_button"

# Enter email
- extendedWaitUntil:
    visible:
      id: "input"
    timeout: 15000
- tapOn:
    id: "input"
- inputText: ${WOO_EMAIL}
- tapOn:
    id: "login_continue_button"

# Dismiss Google Password Manager if it appears
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"

# Handle Magic Link screen
- runFlow:
    when:
      visible:
        id: "login_enter_password"
    commands:
      - tapOn:
          id: "login_enter_password"

# Dismiss Google Password Manager again if it appears on password screen
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"

# Enter wrong password
- extendedWaitUntil:
    visible:
      id: "input"
    timeout: 10000
- tapOn:
    id: "input"
- inputText: "definitely_wrong_password_12345"
- tapOn:
    id: "bottom_button"

# Verify error message appears
- extendedWaitUntil:
    visible: ".*password.*incorrect.*|.*invalid.*|.*wrong.*"
    timeout: 15000
    label: "Wait for wrong password error"

- takeScreenshot: login_wrong_credentials
