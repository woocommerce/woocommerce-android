# Smoke Test: Login - Wrong account for the store
# P2 ref: Login > Wrong account for the store
#
# Tests that the app shows an appropriate error when logging in with
# an account that does not have access to the specified store.
#
# Required env vars: WOO_WRONG_ACCOUNT_STORE_URL, WOO_WRONG_ACCOUNT_EMAIL, WOO_WRONG_ACCOUNT_PASSWORD
appId: com.woocommerce.android.dev
name: "Login - Wrong account for the store"
tags:
  - smoke
  - login
---
- launchApp:
    clearState: true

# Wait for app to finish loading after clearState
- extendedWaitUntil:
    visible: ".*Skip.*|.*Enter your store address.*|.*Log in.*"
    timeout: 30000

# Skip carousel if shown
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

# Tap "Enter your store address"
- extendedWaitUntil:
    visible:
      id: "button_login_store"
    timeout: 15000
- tapOn:
    id: "button_login_store"
    retryTapIfNoChange: true

# Enter the store URL where this account does not have access
- extendedWaitUntil:
    visible:
      id: "input"
    timeout: 10000
- tapOn:
    id: "input"
- inputText: ${WOO_WRONG_ACCOUNT_STORE_URL}
- tapOn:
    id: "bottom_button"
    retryTapIfNoChange: true

# Enter email
- extendedWaitUntil:
    visible:
      id: "input"
    timeout: 15000
- tapOn:
    id: "input"
- inputText: ${WOO_WRONG_ACCOUNT_EMAIL}
- tapOn:
    id: "login_continue_button"
    retryTapIfNoChange: true

# Dismiss Google Password Manager if it appears
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"

# Handle Magic Link screen
- runFlow:
    when:
      visible:
        id: "login_enter_password"
    commands:
      - tapOn:
          id: "login_enter_password"

# Dismiss Google Password Manager again if it appears on password screen
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"

# Enter password
- extendedWaitUntil:
    visible:
      id: "input"
    timeout: 10000
- tapOn:
    id: "input"
- inputText: ${WOO_WRONG_ACCOUNT_PASSWORD}
- hideKeyboard
- tapOn:
    id: "bottom_button"
    retryTapIfNoChange: true

# Verify error: account does not have access to this store
- extendedWaitUntil:
    visible: ".*not a WooCommerce.*|.*does not have.*|.*role.*|.*permission.*|.*not connected.*"
    timeout: 30000

- takeScreenshot: login_wrong_account
