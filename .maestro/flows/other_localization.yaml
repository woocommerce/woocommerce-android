# Smoke Test: Other - Localization
# p2: other.localization
# P2 ref: Other > Switch your device to a non-English language and take a look around
#
# Verifies:
#   - With the app language set to German, the tabs and their screens show German text
#
# The runner logs in first, then sets the app's language to German before this flow
# and resets it afterwards, because Maestro cannot change the language itself.
appId: com.woocommerce.android
name: "Other - Localization"
tags:
  - smoke_extended
  - other
  - app_locale_de
---
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: "Mein Shop"
    timeout: 45000
    label: "My store tab is in German"
- assertNotVisible: "My store"
- takeScreenshot: localization_my_store

- tapOn:
    id: "orders"
- extendedWaitUntil:
    visible:
      id: "order_list"
    timeout: 15000
- assertVisible:
    text: "Bestellungen"
    label: "Orders tab is in German"
- takeScreenshot: localization_orders

- tapOn:
    id: "products"
- extendedWaitUntil:
    visible:
      id: "product_list"
    timeout: 15000
- assertVisible:
    text: "Produkte"
    label: "Products tab is in German"
- takeScreenshot: localization_products

- tapOn:
    id: "moreMenu"
- extendedWaitUntil:
    visible:
      id: "more_menu_compose_view"
    timeout: 15000
- assertVisible:
    text: "Einstellungen"
    label: "Settings menu item is in German"
- takeScreenshot: localization_menu
