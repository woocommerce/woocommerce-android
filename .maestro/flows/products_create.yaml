# Smoke Test: Products - Create Product
# P2 ref: Products > Create product
#
# Verifies:
#   - Add product button works
#   - Manual product creation option available
#   - Product name can be entered
#   - Product description, price, inventory can be set
appId: com.woocommerce.android.dev
name: "Products - Create a new product"
tags:
  - smoke
  - products
---
# Reuse the logged-in session — login flows run first and leave the
# app authenticated. See subflows/ensure_logged_in.yaml.
- runFlow:
    file: ../subflows/ensure_logged_in.yaml

# Navigate to Products
- runFlow:
    file: ../subflows/navigate_to_products.yaml

# Tap Add Product button
- tapOn:
    id: "addProductButton"
    retryTapIfNoChange: true
    label: "Tap Add Product"

# Wait for creation options sheet or product type selection
- extendedWaitUntil:
    visible: ".*manual.*|.*Manual.*|.*Select a product type.*|.*Simple physical.*"
    timeout: 15000
    label: "Wait for product creation entry"

# Select manual creation if the AI vs Manual option sheet appears
- runFlow:
    when:
      visible: ".*manual.*|.*Manual.*"
    commands:
      - tapOn: ".*manual.*|.*Manual.*"

# Handle product type selection sheet if it appears
- runFlow:
    when:
      visible: ".*Simple physical product.*"
    commands:
      - tapOn: ".*Simple physical product.*"

# Wait for product detail/creation form
- extendedWaitUntil:
    visible: ".*GOT IT.*|.*Write with AI.*|.*Describe your product.*"
    timeout: 20000
    label: "Wait for product creation form"

# Dismiss "Write with AI" tooltip if it appears
- runFlow:
    when:
      visible: "GOT IT"
    commands:
      - tapOn: "GOT IT"

# Wait for form to be ready
- extendedWaitUntil:
    visible:
      id: "editText"
    timeout: 10000

- takeScreenshot: product_create_empty

# Enter product name
- tapOn:
    id: "editText"
    label: "Tap product name field"
- inputText: "Maestro Test Product"

# Hide keyboard
- hideKeyboard

- takeScreenshot: product_create_named

# Verify key product fields are visible
- assertVisible: "Price"
- assertVisible: "Inventory"
- assertVisible: "Product type"

- takeScreenshot: product_create_with_fields

# Discard instead of publishing (smoke test only)
- back

# Handle discard dialog
- runFlow:
    when:
      visible: "Discard"
    commands:
      - tapOn: "Discard"

- extendedWaitUntil:
    visible:
      id: "productsRecycler"
    timeout: 10000
