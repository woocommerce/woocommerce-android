# Smoke Test: Blaze - Campaign creation flow
# P2 ref: Hub menu > Blaze > Create Campaign
#
# Verifies:
#   - Blaze option accessible from More Menu
#   - Blaze campaign list/dashboard loads
#   - Create campaign flow can be triggered
#   - Campaign creation webview loads
appId: com.woocommerce.android.dev
name: "Blaze - Campaign creation"
tags:
  - smoke
  - blaze
  - hub_menu
---
# Reuse the logged-in session — login flows run first and leave the
# app authenticated. See subflows/ensure_logged_in.yaml.
- runFlow:
    file: ../subflows/ensure_logged_in.yaml

# Navigate to More Menu
- runFlow:
    file: ../subflows/navigate_to_more_menu.yaml

# Find and tap Blaze
- scrollUntilVisible:
    element: "Blaze"
    direction: DOWN
    timeout: 15000
    label: "Scroll to Blaze in hub menu"

- tapOn: "Blaze"

# Wait for Blaze screen to load
- extendedWaitUntil:
    visible: "Blaze"
    timeout: 20000

- takeScreenshot: blaze_screen

# Try to create a campaign
- runFlow:
    when:
      visible: "Create campaign"
    commands:
      - tapOn: "Create campaign"
      - extendedWaitUntil:
          visible: ".*"
          timeout: 20000
          label: "Wait for campaign creation flow"
          optional: true
      - takeScreenshot: blaze_create_campaign
      - back

# Go back
- back
- runFlow:
    when:
      notVisible:
        id: "more_menu_compose_view"
    commands:
      - back
