# Smoke Test: Orders - Detail view and actions
# p2: orders.receipt, orders.note
# P2 ref: Orders > Refund, Add order note, Mark complete, See receipt
#
# Verifies:
#   - Opening an order shows the detail container and status tags
#   - Can scroll through products and payment sections
#   - Can add an order note via the "Add a note" row (private by default)
#   - Returns to orders list cleanly
#
# Uses the exact resource IDs from order_detail_note_list.xml
# (noteList_addNoteContainer, notesList_notes) and menu_add.xml
# (menu_add) to avoid ambiguous text matches that can collide with the
# "Add note" button in the order creation flow.
appId: com.woocommerce.android.dev
name: "Orders - Detail view and actions"
tags:
  - smoke_extended
  - flaky_quarantine
  - orders
  - destructive
---
# Start from an already-authenticated session (see comment in
# ensure_logged_in.yaml — re-logging in on every run triggers WPCom
# security screens).
- runFlow:
    file: ../subflows/ensure_logged_in.yaml

# Navigate to Orders
- runFlow:
    file: ../subflows/navigate_to_orders.yaml

# Open one of this run's seeded COMPLETED orders — never an arbitrary
# first row. The "See receipt" action is only exposed on paid orders in
# Completed status (a paid Processing order does not show it), so filter
# the list to Completed before selecting. On the shared store an
# arbitrary first row could be a manual tester's real order, so target
# this run's fixture by its run id. Clear any previously-applied filters
# first to avoid cross-test contamination.
- tapOn:
    id: "btn_order_filter"
    label: "Open filters"

- runFlow:
    when:
      visible: ".*Clear.*"
    commands:
      - tapOn:
          text: ".*Clear.*"
          label: "Clear existing filters"

- extendedWaitUntil:
    visible: "Order Status"
    timeout: 10000

- tapOn:
    text: "Order Status"
    label: "Open status filter"

- extendedWaitUntil:
    visible: ".*Completed.*"
    timeout: 10000

- tapOn:
    text: ".*Completed.*"
    label: "Select Completed status"

- tapOn:
    id: "showOrdersButton"
    label: "Apply filter"

- extendedWaitUntil:
    visible:
      id: "ordersList"
    timeout: 15000

# Pull-to-refresh so the Completed filter reflects the latest server
# state rather than a stale cached list.
- swipe:
    from:
      id: "ordersList"
    direction: DOWN
    duration: 800

# Open this run's completed order. Prefer the suite-tagged order created
# by orders_create.yaml (customer last name "SmokeTest-<run id>") in a
# full-suite run; fall back to this run's seeded completed fixture (its
# billing name is the run id) when this flow runs standalone. Never fall
# back to an arbitrary first row.
- runFlow:
    when:
      visible: ".*SmokeTest-${SUITE_RUN_ID}.*"
    commands:
      - tapOn:
          text: ".*SmokeTest-${SUITE_RUN_ID}.*"
          retryTapIfNoChange: true
          label: "Open this run's SmokeTest order"
      - extendedWaitUntil:
          visible:
            id: "orderDetail_container"
          timeout: 15000
          label: "Wait for SmokeTest order detail"

- runFlow:
    when:
      notVisible:
        id: "orderDetail_container"
    commands:
      - tapOn:
          text: ".*${SUITE_RUN_ID}.*"
          retryTapIfNoChange: true
          label: "Open this run's seeded completed order (fallback)"

# Wait for order detail
- extendedWaitUntil:
    visible:
      id: "orderDetail_container"
    timeout: 15000

# Capture this order's number from the toolbar. The rendered receipt echoes it
# as "Summary: Order #<n>", which is asserted later to prove the receipt
# actually rendered (and belongs to this order).
- copyTextFrom:
    text: "Order #.*"
- evalScript: ${output.orderNumber = maestro.copiedText.trim()}

# Verify order detail elements
- assertVisible:
    id: "orderStatus_orderTags"
    label: "Order status tags are visible"

- takeScreenshot: order_detail_top

# Scroll to the products section. A plain `scroll` can overshoot on
# taller devices and land in payment totals before this assertion runs.
- scrollUntilVisible:
    element:
      id: "productInfo_name"
    direction: DOWN
    timeout: 15000
    label: "Scroll to product row in order detail"

- takeScreenshot: order_detail_products

# Scroll to payment info
- scrollUntilVisible:
    element:
      id: "paymentInfo_total"
    direction: DOWN
    timeout: 15000
    label: "Scroll to payment total"

- takeScreenshot: order_detail_payment

# ── See receipt ───────────────────────────────────────────────────────
- scrollUntilVisible:
    element: "See receipt"
    direction: DOWN
    timeout: 15000
    label: "Scroll to See receipt"

- tapOn:
    text: "See receipt"
    retryTapIfNoChange: true
    label: "Open receipt preview"

# Assert the receipt actually RENDERED, not merely that the preview screen
# opened. A successful receipt echoes this order as "Summary: Order #<n>" in
# its webview content. The receipt requires a server-side POST
# /orders/{id}/receipt; when that fails (e.g. 403 for a user without create
# permission) the screen shows only a transient "Receipt Preview" toolbar and
# an error toast, with no rendered receipt — so asserting the toolbar title
# (or ".*Print.*", which also false-matched the order-detail "printing
# receipts" text) would pass without a receipt. Matching the rendered summary
# line fails loudly in that case, which is the correct outcome.
- extendedWaitUntil:
    visible: "Summary: ${output.orderNumber}"
    timeout: 30000
    label: "Wait for rendered receipt (Summary: ${output.orderNumber})"

- takeScreenshot: order_receipt_preview

# Only the receipt preview is on the back stack here, so one back returns to
# the order detail (reached only because the assertion above confirmed it).
- back

- extendedWaitUntil:
    visible:
      id: "orderDetail_container"
    timeout: 15000

# ── Add an order note ────────────────────────────────────────────────
# Use the addNoteContainer ID directly — more robust than matching the
# "Add a note" text which is not tagged as clickable (the outer
# LinearLayout handles the click).
- scrollUntilVisible:
    element:
      id: "noteList_addNoteContainer"
    direction: DOWN
    timeout: 15000
    label: "Scroll to notes section"

- tapOn:
    id: "noteList_addNoteContainer"
    retryTapIfNoChange: true
    label: "Tap Add a note row"

# Add note screen
- extendedWaitUntil:
    visible:
      id: "addNote_editor"
    timeout: 15000

- tapOn:
    id: "addNote_editor"
- inputText: "Maestro smoke test note"
- hideKeyboard

- takeScreenshot: order_note_typed

# Save the note via the Add menu item
- tapOn:
    id: "menu_add"
    label: "Save order note"

# Back on order detail — the notes list is below the "Add a note" row, so
# scroll it into view before asserting rather than checking visibility while
# it is still off-screen.
- scrollUntilVisible:
    element:
      id: "notesList_notes"
    direction: DOWN
    timeout: 15000
    label: "Scroll to notes list"

- scrollUntilVisible:
    element: ".*Maestro smoke test note.*"
    direction: DOWN
    timeout: 15000
    label: "Scroll to added note"

- takeScreenshot: order_note_added

# Go back to orders list
- back

- extendedWaitUntil:
    visible:
      id: "ordersList"
    timeout: 10000
