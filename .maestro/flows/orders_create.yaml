# Smoke Test: Orders - Create Order
# p2: orders.create.products, orders.create.variable-products, orders.create.quantity, orders.create.product-discount, orders.create.custom-amount, orders.create.custom-amount-note, orders.create.shipping, orders.create.customer-add, orders.create.customer-edit, orders.create.note
# P2 ref: Orders > Create an order (add products, custom amount, customer, customer note)
#
# Verifies:
#   - Order creation FAB works
#   - Add a configured test variable product from the product selector and choose a variation
#   - Increase/decrease product quantity with the stepper
#   - Add a product-level discount
#   - Add a fixed-amount custom amount with a name
#   - Add a fixed shipping amount
#   - Add a run-scoped customer manually
#   - Edit the added customer's last name
#   - Add a customer-facing note
#   - All sections display the added data
#   - Tap "Create" to submit the order — lands on order detail and leaves
#     the pending-payment order available for downstream payment flows
#
# The order IS committed to the staging store.
# Staging orders use test data (SmokeTest customer, $10 gift wrap) so
# accumulation across runs is acceptable.
appId: com.woocommerce.android.dev
name: "Orders - Create a new order"
tags:
  - smoke_extended
  - flaky_quarantine
  - orders
  - destructive
---
# Start from an already-authenticated session (see comment in
# ensure_logged_in.yaml — re-logging in on every run triggers WPCom
# security screens).
- runFlow:
    file: ../subflows/ensure_logged_in.yaml

# Navigate to Orders
- runFlow:
    file: ../subflows/navigate_to_orders.yaml

# Tap Create Order FAB
- tapOn:
    id: "createOrderButton"
    retryTapIfNoChange: true
    label: "Tap Create Order FAB"

# Wait for order creation screen (title and Add products are always visible on empty creation)
- extendedWaitUntil:
    visible: "Add products"
    timeout: 15000

- takeScreenshot: order_create_empty

# ── Add a product ─────────────────────────────────────────────────────
- tapOn:
    text: "Add products"
    label: "Tap Add products"

# Product selector loaded
- extendedWaitUntil:
    visible: ".*Search Products.*"
    timeout: 15000

- takeScreenshot: order_create_product_selector

# Search for the configured test variable product instead of relying on
# whichever product happens to be first in the store. Override
# MAESTRO_FIXTURE_VARIABLE_PRODUCT in .env.local if the test store uses
# a different sample product name.
- tapOn:
    text: ".*Search Products.*"
    label: "Focus product selector search"

- inputText: ${FIXTURE_VARIABLE_PRODUCT}
- hideKeyboard

- extendedWaitUntil:
    visible: "${FIXTURE_VARIABLE_PRODUCT}"
    timeout: 20000
    label: "Wait for configured variable product"

- tapOn:
    text: "${FIXTURE_VARIABLE_PRODUCT}"
    retryTapIfNoChange: true
    label: "Open configured variable product variations"

# Pick a concrete variation so the order contains a purchasable item,
# not just the parent variable product.
- extendedWaitUntil:
    visible: ".*Small.*|.*Large.*|.*Select a variation.*"
    timeout: 20000
    label: "Wait for variation selector"

- tapOn:
    text: ".*Small.*|.*Large.*"
    index: 0
    retryTapIfNoChange: true
    label: "Select first variation"

# Confirm selection (regex matches "Select 1 Product" or "Select N Products")
- extendedWaitUntil:
    visible: ".*Select \\d+ Product.*"
    timeout: 15000

- tapOn:
    text: ".*Select \\d+ Product.*"
    label: "Confirm product selection"

# Back on order creation
- extendedWaitUntil:
    visible: "New order"
    timeout: 15000

- takeScreenshot: order_create_with_product

# ── Adjust product quantity and apply product discount ───────────────
- tapOn:
    text: ".*${FIXTURE_VARIABLE_PRODUCT}.*|.*Small.*|.*Large.*"
    index: 0
    retryTapIfNoChange: true
    label: "Expand added product row"

- extendedWaitUntil:
    visible: "Order count"
    timeout: 10000

- tapOn:
    text: "Increase product quantity"
    retryTapIfNoChange: true
    label: "Increase product quantity"

- assertVisible:
    text: ".*2 ×.*|.*2 x.*"
    label: "Quantity increased to 2"

- tapOn:
    text: "Decrease product quantity"
    retryTapIfNoChange: true
    label: "Decrease product quantity"

- assertVisible:
    text: ".*1 ×.*|.*1 x.*"
    label: "Quantity decreased back to 1"

- tapOn:
    text: "Add discount"
    retryTapIfNoChange: true
    label: "Open product discount editor"

- extendedWaitUntil:
    visible: "Discount"
    timeout: 15000

# The discount field auto-focuses when the screen opens.
- inputText: "100"
- hideKeyboard

- takeScreenshot: order_create_product_discount

- tapOn:
    text: "Done"
    retryTapIfNoChange: true
    label: "Save product discount"

- extendedWaitUntil:
    visible: "New order"
    timeout: 15000

- assertVisible:
    text: ".*Discount.*|.*Price after discount.*"
    label: "Discount is reflected on the product row"

# ── Add a custom amount (fixed, with a name) ──────────────────────────
- scrollUntilVisible:
    element: "Add custom amount"
    direction: DOWN
    timeout: 10000
    label: "Scroll to custom amounts section"

- tapOn:
    text: "Add custom amount"
    label: "Tap Add custom amount"

# Same flake pattern as the orders_cash_payment Collect Payment tap:
# occasionally the first tap visibly depresses the row but the "Select
# custom amount type" bottom sheet never presents. Give the happy path
# 8s, then re-tap if the sheet still isn't there (the first tap was
# lost). On the normal path the re-tap is skipped because the sheet is
# already visible.
- runFlow:
    when:
      notVisible: "A fixed amount"
    commands:
      - extendedWaitUntil:
          visible: "A fixed amount"
          timeout: 8000

- runFlow:
    when:
      notVisible: "A fixed amount"
    commands:
      - tapOn:
          text: "Add custom amount"
          retryTapIfNoChange: true
          label: "Retry tap on Add custom amount (first was lost)"

- extendedWaitUntil:
    visible: "A fixed amount"
    timeout: 15000

- tapOn:
    text: "A fixed amount"
    label: "Choose fixed amount"

# Fill amount and name in the custom amount dialog
- extendedWaitUntil:
    visible:
      id: "editPrice"
    timeout: 10000

- tapOn:
    id: "editPrice"
- eraseText
# Emulator locale uses comma as decimal separator — entering "1000" yields 10,00
- inputText: "1000"
- hideKeyboard

- tapOn:
    id: "customAmountNameText"
- inputText: "Gift wrap"
- hideKeyboard

- takeScreenshot: order_create_custom_amount_dialog

- tapOn:
    id: "buttonDone"
    label: "Tap Done on custom amount"

# Back on order creation — verify custom amount was added
- extendedWaitUntil:
    visible: "New order"
    timeout: 15000

- assertVisible:
    text: "Gift wrap"
    label: "Custom amount name is visible in creation screen"

- takeScreenshot: order_create_with_custom_amount

# ── Add shipping ────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      id: "add_shipping_button"
    direction: DOWN
    timeout: 10000
    label: "Scroll to Add shipping"

- tapOn:
    id: "add_shipping_button"
    retryTapIfNoChange: true
    label: "Tap Add shipping"

- extendedWaitUntil:
    visible: "Add Shipping"
    timeout: 15000

- tapOn:
    text: "Amount"
    label: "Focus shipping amount"
- inputText: "500"
- hideKeyboard

- takeScreenshot: order_create_shipping_form

- tapOn:
    text: "Add Shipping"
    retryTapIfNoChange: true
    label: "Save shipping line"

- extendedWaitUntil:
    visible: "New order"
    timeout: 15000

- assertVisible:
    text: ".*Shipping.*"
    label: "Shipping line is visible in creation screen"

- takeScreenshot: order_create_with_shipping

# ── Add a customer-facing note ────────────────────────────────────────
# Added BEFORE the customer on purpose: when both customer and note are
# empty, the "Add note" button lives in customer_section (via
# initCustomerAndNotesEmptySection). Once a customer is added, that
# button migrates to notes_section whose bounds overlap with the Compose
# totals_section, and the totals overlay intercepts taps on it.
- scrollUntilVisible:
    element: "Add note"
    direction: DOWN
    timeout: 10000
    label: "Scroll to notes button in customer section"

- tapOn:
    text: "Add note"
    childOf:
      id: "customer_section"
    retryTapIfNoChange: true
    label: "Tap Add note in empty customer section"

- extendedWaitUntil:
    visible:
      id: "customerOrderNote_editor"
    timeout: 15000

- tapOn:
    id: "customerOrderNote_editor"
- inputText: "Maestro smoke test note - please gift wrap."
- hideKeyboard

- takeScreenshot: order_create_customer_note_typed

# Save via toolbar DONE
- tapOn:
    id: "menu_done"
    label: "Save customer note"

- extendedWaitUntil:
    visible: "New order"
    timeout: 15000

- assertVisible:
    text: ".*Maestro smoke test note.*"
    label: "Customer note visible in creation screen"

# ── Add a customer ────────────────────────────────────────────────────
# Add a run-scoped customer manually. The flow intentionally avoids
# depending on REST-created customers so the full suite only needs
# UI-login credentials.
- scrollUntilVisible:
    element: "Add customer details"
    direction: DOWN
    timeout: 10000
    label: "Scroll to customer section"

- tapOn:
    text: "Add customer details"
    label: "Tap Add customer details"

- extendedWaitUntil:
    visible: "Search for customers"
    timeout: 15000

- tapOn:
    text: "add customer"
    retryTapIfNoChange: true
    label: "Tap add customer FAB"

- extendedWaitUntil:
    visible:
      id: "first_name"
    timeout: 15000
    label: "Wait for manual customer form"

- tapOn:
    id: "first_name"
    index: 0
- inputText: "Maestro"
- hideKeyboard

- tapOn:
    id: "last_name"
    index: 0
- inputText: "SmokeTest-${SUITE_RUN_ID}"
- hideKeyboard

- tapOn:
    id: "email"
    index: 0
- inputText: ${FIXTURE_CUSTOMER_EMAIL}
- hideKeyboard

- takeScreenshot: order_create_manual_customer

- tapOn:
    id: "menu_done"
    label: "Save manual customer"

- extendedWaitUntil:
    visible: "New order"
    timeout: 15000

- takeScreenshot: order_create_with_customer

- takeScreenshot: order_create_fully_customized

# ── Submit without collecting payment ────────────────────────────────
# Use the toolbar Create action, not the totals-panel Collect Payment
# button. This leaves the UI-created pending-payment order available
# for the QR/share-link and cash-payment smoke flows that run next.
- tapOn:
    id: "menu_create"
    retryTapIfNoChange: true
    label: "Create order without starting payment flow"

- extendedWaitUntil:
    visible:
      id: "orderDetail_container"
    timeout: 30000

- takeScreenshot: order_create_created_pending_detail

- back

- extendedWaitUntil:
    visible:
      id: "ordersList"
    timeout: 15000

- takeScreenshot: order_create_completed
