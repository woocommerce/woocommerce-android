# Smoke Test: Hub Menu - Settings
# p2: hub.settings
# P2 ref: Hub menu > Settings > Smoke test all items (ignore Delete Account)
#
# Verifies:
#   - More Menu top-level items are visible (Settings section + Payments)
#   - Settings screen opens from the More Menu
#   - Help & support, Troubleshoot Connection, Privacy settings,
#     Experimental features, and About the app each open and return
#   - Log Out is rendered but never tapped
appId: com.woocommerce.android.dev
name: "Hub Menu - Settings"
tags:
  - smoke_extended
  - flaky_quarantine
  - hub_menu
---
- runFlow:
    file: ../subflows/ensure_logged_in.yaml

- runFlow:
    file: ../subflows/navigate_to_more_menu.yaml

# ── More Menu overview ───────────────────────────────────────────────
# Two More Menu sections are visible from the top: Settings (with the
# Settings item, and — on WPCom non-free-trial stores only —
# Subscriptions) and the general section (Payments, WC Admin, View
# Store, Coupons, Reviews, Customers, Inbox). Assert the always-on
# anchors so a regressed menu layout is caught here. Subscriptions is
# hidden when isWpComStore is false (our staging store is
# Jetpack-connected / self-hosted), so it is not asserted.
- assertVisible: "Settings"
- assertVisible: "Payments"

- takeScreenshot: hub_menu_overview

# ── Open Settings ────────────────────────────────────────────────────
# "Settings" appears twice: as the section title ("Settings" header)
# and as the row ("Settings / Update your preferences"). index: 0 is
# the section header, index: 1 is the tappable row.
- tapOn:
    text: "Settings"
    index: 1
    label: "Open Settings screen"

- extendedWaitUntil:
    visible: "Help & support"
    timeout: 15000

- takeScreenshot: settings_screen_top

# Help & support opens a separate help activity.
- tapOn:
    id: "option_help_and_support"
    retryTapIfNoChange: true
    label: "Open Help & support"

- extendedWaitUntil:
    visible: ".*How can we help.*|.*Help Center.*|.*Contact Support.*"
    timeout: 15000
    label: "Wait for Help & support"

- takeScreenshot: settings_help_support
- back

- extendedWaitUntil:
    visible: "Troubleshoot Connection"
    timeout: 15000

# Troubleshoot Connection.
- tapOn:
    id: "option_troubleshoot_connection"
    retryTapIfNoChange: true
    label: "Open Troubleshoot Connection"

- extendedWaitUntil:
    visible: "Troubleshoot Connection"
    timeout: 15000

- extendedWaitUntil:
    visible: ".*Internet connection.*|.*Connecting to WordPress.com servers.*|.*Store connection.*|.*Orders.*|.*Products.*"
    timeout: 30000
    label: "Wait for troubleshoot checks"

- takeScreenshot: settings_troubleshoot_connection
- back

- extendedWaitUntil:
    visible: "Help & support"
    timeout: 15000

# Privacy settings.
- scrollUntilVisible:
    element: "Privacy settings"
    direction: DOWN
    timeout: 10000
    label: "Scroll to Privacy settings"

- tapOn:
    id: "option_privacy"
    retryTapIfNoChange: true
    label: "Open Privacy settings"

- extendedWaitUntil:
    visible: "Privacy"
    timeout: 15000

- assertVisible: "Analytics"

- scrollUntilVisible:
    element: "Report Crashes"
    direction: DOWN
    timeout: 10000
    label: "Scroll to Report Crashes"

- assertVisible: "Report Crashes"

- takeScreenshot: settings_privacy
- back

- extendedWaitUntil:
    visible: "Privacy settings"
    timeout: 15000

# Experimental features.
- tapOn:
    id: "option_beta_features"
    retryTapIfNoChange: true
    label: "Open Experimental features"

- extendedWaitUntil:
    visible: ".*View Add-ons.*|.*POS Local Catalog.*|.*Application Passwords.*"
    timeout: 15000
    label: "Wait for Experimental features"

- takeScreenshot: settings_experimental_features
- back

- extendedWaitUntil:
    visible: "Privacy settings"
    timeout: 15000

- scrollUntilVisible:
    element: "About the app"
    direction: DOWN
    timeout: 10000
    label: "Scroll to About section"

- assertVisible: "About the app"

# About the app row is labelled with the app name under the About
# header, so tap the XML id instead of the repeated section text.
- tapOn:
    id: "option_about"
    retryTapIfNoChange: true
    label: "Open About the app"

- extendedWaitUntil:
    visible: ".*About WooCommerce.*|.*Automattic Family.*|.*Version.*"
    timeout: 15000
    label: "Wait for About screen"

- takeScreenshot: settings_about_app
- back

- extendedWaitUntil:
    visible: "About the app"
    timeout: 15000

- scrollUntilVisible:
    element: "Log out"
    direction: DOWN
    timeout: 10000
    label: "Scroll to Log out"

- assertVisible: "Log out"

- takeScreenshot: settings_screen_bottom

# Go back to More Menu
- back

- extendedWaitUntil:
    visible:
      id: "more_menu_compose_view"
    timeout: 10000
