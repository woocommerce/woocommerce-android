# Smoke Test: Push notifications without Jetpack
# p2: push-no-jetpack.login, push-no-jetpack.card-visible, push-no-jetpack.unlock
# p2: push-no-jetpack.setup-completes, push-no-jetpack.card-hidden
# p2: push-no-jetpack.notification-arrives, push-no-jetpack.notification-deep-link
# P2 ref: Push notifications without Jetpack
#
# Logs in to a WooCommerce site without Jetpack with its site credentials, sets up
# push notifications from the dashboard card, then creates an order through the
# REST API and opens its real push. The runner disconnects the store from
# WordPress.com first, so the setup connects it again on every run.
#
# Required env vars, written by setup-jn-store.sh --no-jetpack-site:
#   MAESTRO_WOO_NO_JETPACK_SITE_URL
#   MAESTRO_WOO_NO_JETPACK_SITE_ADMIN_USERNAME
#   MAESTRO_WOO_NO_JETPACK_SITE_ADMIN_PASSWORD
#   MAESTRO_WOO_NO_JETPACK_CONSUMER_KEY
#   MAESTRO_WOO_NO_JETPACK_CONSUMER_SECRET
appId: com.woocommerce.android
name: "Push notifications without Jetpack"
tags:
  - smoke_extended
  - push
  - destructive
  - push_no_jetpack
env:
  NO_JETPACK_SITE_URL: ${MAESTRO_WOO_NO_JETPACK_SITE_URL}
  NO_JETPACK_CONSUMER_KEY: ${MAESTRO_WOO_NO_JETPACK_CONSUMER_KEY}
  NO_JETPACK_CONSUMER_SECRET: ${MAESTRO_WOO_NO_JETPACK_CONSUMER_SECRET}
# The next flows sign in to the lab store, which this session can't switch to.
onFlowComplete:
  - clearState
---
- assertTrue:
    condition: ${NO_JETPACK_DISCONNECTED == "yes"}
    label: "The runner disconnected the store from WordPress.com"

- launchApp:
    clearState: true

- runFlow:
    file: ../subflows/dismiss_login_carousel.yaml

- runFlow:
    file: ../subflows/open_site_address_login.yaml

- tapOn:
    id: "input"
- inputText: ${MAESTRO_WOO_NO_JETPACK_SITE_URL}
- runFlow:
    file: ../subflows/hide_keyboard.yaml
    env:
      KEYBOARD_TARGET_ID: "bottom_button"
- tapOn:
    id: "bottom_button"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Username"
    timeout: 30000
- tapOn: "Username"
- inputText: ${MAESTRO_WOO_NO_JETPACK_SITE_ADMIN_USERNAME}
- tapOn: "Password"
- inputText: ${MAESTRO_WOO_NO_JETPACK_SITE_ADMIN_PASSWORD}
- tapOn: "Continue"

- extendedWaitUntil:
    visible:
      id: "dashboard_container"
    timeout: 60000
    label: "Logged in with the site credentials"

- extendedWaitUntil:
    visible: ${STRING_MY_STORE_WIDGET_PUSH_NOTIFICATIONS_TITLE}
    timeout: 30000
    label: "The push notifications card is visible"

- takeScreenshot: push_no_jetpack_card

- tapOn: ${STRING_MY_STORE_WIDGET_PUSH_NOTIFICATIONS_TITLE}

- extendedWaitUntil:
    visible: ${STRING_WOO_PUSH_NOTIFICATIONS_INTRODUCTION_TITLE}
    timeout: 15000
- tapOn: ${STRING_WOO_PUSH_NOTIFICATIONS_INTRODUCTION_CONTINUE}

- extendedWaitUntil:
    visible: ${STRING_WOO_PUSH_NOTIFICATIONS_CONNECTION_STEPS_GO_TO_MY_STORE}
    timeout: 60000
    label: "The push notifications setup completes"
- assertVisible: ${STRING_WOO_PUSH_NOTIFICATIONS_CONNECTION_STEPS_STEP_CHECK_PLUGIN_COMPATIBILITY}
- assertVisible: ${STRING_WOO_PUSH_NOTIFICATIONS_CONNECTION_STEPS_STEP_CONNECT_STORE}
- assertVisible: ${STRING_WOO_PUSH_NOTIFICATIONS_CONNECTION_STEPS_STEP_ENABLE_PUSH_NOTIFICATIONS}
- assertNotVisible: ${STRING_WOO_PUSH_NOTIFICATIONS_CONNECTION_STEPS_ERROR}

- takeScreenshot: push_no_jetpack_setup_complete

- tapOn: ${STRING_WOO_PUSH_NOTIFICATIONS_CONNECTION_STEPS_GO_TO_MY_STORE}

- extendedWaitUntil:
    visible:
      id: "dashboard_container"
    timeout: 15000
- assertNotVisible:
    text: ${STRING_MY_STORE_WIDGET_PUSH_NOTIFICATIONS_TITLE}
    label: "The push notifications card is hidden after the setup"

# A total no other order has lets the flow pick this order's notification.
- evalScript: "${output.pushOrder = json(http.post(NO_JETPACK_SITE_URL + '/wp-json/wc/v3/orders?consumer_key=' + NO_JETPACK_CONSUMER_KEY + '&consumer_secret=' + NO_JETPACK_CONSUMER_SECRET, {headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status: 'processing', fee_lines: [{name: 'Maestro push', total: (10 + Math.random() * 89.99).toFixed(2)}]})}).body)}"
- assertTrue:
    condition: ${output.pushOrder.number != null}
    label: "The order for the push was created"

- pressKey: HOME

- swipe:
    start: "50%,1%"
    end: "50%,70%"
    duration: 600
    label: "Open the notification shade"

# "." stands for the currency symbol, which a ${...} script can't contain.
- extendedWaitUntil:
    visible: ".*New order for .${output.pushOrder.total} on .*"
    timeout: 90000
    label: "Wait for this order's push notification"

- takeScreenshot: push_no_jetpack_notification

- tapOn:
    text: ".*New order for .${output.pushOrder.total} on .*"
    label: "Open the push notification"

- extendedWaitUntil:
    visible: "Order #${output.pushOrder.number}"
    timeout: 30000
    label: "The push opens this order"

- assertVisible:
    id: "orderDetail_container"

- takeScreenshot: push_no_jetpack_order
