# Smoke Test: Google for Woo
# P2 ref: Google for Woo > Trigger campaign creation, check webview loads
#
# Verifies:
#   - Google for Woo option accessible from More Menu
#   - Webview loads correctly for Google campaign creation
appId: com.woocommerce.android.dev
name: "Google for Woo - Campaign creation webview"
tags:
  - smoke
  - google_for_woo
  - hub_menu
---
# Navigate to More Menu (login handled by onFlowStart hook)
- runFlow:
    file: ../subflows/navigate_to_more_menu.yaml

# Find and tap Google for Woo
- scrollUntilVisible:
    element: "Google for WooCommerce"
    direction: DOWN
    timeout: 15000
    label: "Scroll to Google for Woo in hub menu"

- tapOn: "Google for WooCommerce"

# Wait for Google for Woo webview to load — generous timeout for webview
- extendedWaitUntil:
    visible: ".*Google.*|.*Get started.*"
    timeout: 25000
    label: "Wait for Google for Woo webview"

- takeScreenshot: google_for_woo

# Go back
- back
- runFlow:
    when:
      notVisible:
        id: "more_menu_compose_view"
    commands:
      - back
