# Smoke Test: Products - Product Detail
# p2: products.detail.description, products.detail.price, products.detail.inventory, products.detail.categories, products.detail.type, products.detail.shipping, products.detail.short-description, products.detail.linked, products.detail.downloads
# P2 ref: Products > Product details (all details)
#
# Verifies:
#   - Product detail opens for this run's seeded simple product
#   - Description, price, inventory, categories, product type, shipping,
#     short description, linked products, and downloadable files all open
#     their editor/detail surfaces and return to product detail
appId: com.woocommerce.android.dev
name: "Products - Product detail view"
tags:
  - smoke_extended
  - flaky_quarantine
  - products
---
- runFlow:
    file: ../subflows/ensure_logged_in.yaml

- runFlow:
    file: ../subflows/navigate_to_products.yaml

- runFlow:
    file: ../subflows/open_product_by_name.yaml
    env:
      PRODUCT_NAME: ${FIXTURE_SIMPLE_PRODUCT}

- takeScreenshot: product_detail_top

# Description editor
- tapOn:
    text: "Description"
    retryTapIfNoChange: true
    label: "Open product description"

- extendedWaitUntil:
    visible:
      id: "visualEditor"
    timeout: 15000
    label: "Wait for description editor"

- takeScreenshot: product_detail_description_editor
- back

- extendedWaitUntil:
    visible:
      id: "editText"
    timeout: 10000

# Price editor
- scrollUntilVisible:
    element: "Price"
    direction: DOWN
    timeout: 15000
    label: "Scroll to Price"

- tapOn:
    text: "Price"
    retryTapIfNoChange: true
    label: "Open product price"

- extendedWaitUntil:
    visible:
      id: "product_regular_price"
    timeout: 15000
    label: "Wait for price editor"

- takeScreenshot: product_detail_price_editor
- back

- extendedWaitUntil:
    visible:
      id: "editText"
    timeout: 10000

# Inventory editor
- scrollUntilVisible:
    element: "Inventory"
    direction: DOWN
    timeout: 15000
    label: "Scroll to Inventory"

- tapOn:
    text: "Inventory"
    retryTapIfNoChange: true
    label: "Open product inventory"

- extendedWaitUntil:
    visible:
      id: "product_sku"
    timeout: 15000
    label: "Wait for inventory editor"

- takeScreenshot: product_detail_inventory_editor
- back

- extendedWaitUntil:
    visible:
      id: "editText"
    timeout: 10000

# Product type picker
- scrollUntilVisible:
    element: "Product type"
    direction: DOWN
    timeout: 15000
    label: "Scroll to Product type"

- tapOn:
    text: "Product type"
    retryTapIfNoChange: true
    label: "Open product type picker"

- extendedWaitUntil:
    visible: ".*Select a product type.*|.*Simple physical product.*|.*Variable product.*"
    timeout: 15000
    label: "Wait for product type picker"

- takeScreenshot: product_detail_product_type_picker
- back

- extendedWaitUntil:
    visible:
      id: "editText"
    timeout: 10000

# Shipping editor
- scrollUntilVisible:
    element: "Shipping"
    direction: DOWN
    timeout: 15000
    label: "Scroll to Shipping"

- tapOn:
    text: "Shipping"
    retryTapIfNoChange: true
    label: "Open product shipping"

- extendedWaitUntil:
    visible:
      id: "product_weight"
    timeout: 15000
    label: "Wait for shipping editor"

- takeScreenshot: product_detail_shipping_editor
- back

- extendedWaitUntil:
    visible:
      id: "editText"
    timeout: 10000

# Short description editor
- scrollUntilVisible:
    element: "Short description"
    direction: DOWN
    timeout: 15000
    label: "Scroll to Short description"

- tapOn:
    text: "Short description"
    retryTapIfNoChange: true
    label: "Open short description"

- extendedWaitUntil:
    visible:
      id: "visualEditor"
    timeout: 15000
    label: "Wait for short description editor"

- takeScreenshot: product_detail_short_description_editor
- back

- extendedWaitUntil:
    visible:
      id: "editText"
    timeout: 10000

# Linked products editor
- scrollUntilVisible:
    element: ".*Upsells.*|.*Cross-sells.*|.*Linked products.*"
    direction: DOWN
    timeout: 15000
    label: "Scroll to linked products"

- tapOn:
    text: ".*Upsells.*|.*Cross-sells.*|.*Linked products.*"
    index: 0
    retryTapIfNoChange: true
    label: "Open linked products"

- extendedWaitUntil:
    visible:
      id: "add_upsell_products"
    timeout: 15000
    label: "Wait for linked products editor"

- assertVisible:
    id: "add_cross_sell_products"
    label: "Cross-sells editor is visible"

- takeScreenshot: product_detail_linked_products_editor
- back

- extendedWaitUntil:
    visible:
      id: "editText"
    timeout: 10000

# Downloadable files editor
- scrollUntilVisible:
    element: "Downloadable files"
    direction: DOWN
    timeout: 15000
    label: "Scroll to Downloadable files"

- tapOn:
    text: "Downloadable files"
    retryTapIfNoChange: true
    label: "Open downloadable files"

- extendedWaitUntil:
    visible:
      id: "productDownloadsRecycler"
    timeout: 15000
    label: "Wait for downloadable files list"

- takeScreenshot: product_detail_downloads_editor
- back

- extendedWaitUntil:
    visible:
      id: "editText"
    timeout: 10000

# Categories editor
- scrollUntilVisible:
    element: "Categories"
    direction: DOWN
    timeout: 15000
    label: "Scroll to Categories"

- tapOn:
    text: "Categories"
    retryTapIfNoChange: true
    label: "Open product categories"

- extendedWaitUntil:
    visible:
      id: "productCategoriesRecycler"
    timeout: 15000
    label: "Wait for categories editor"

- takeScreenshot: product_detail_categories_editor
- back

- extendedWaitUntil:
    visible:
      id: "editText"
    timeout: 10000

- takeScreenshot: product_detail_all_rows_checked

- back

- extendedWaitUntil:
    visible:
      id: "productsRecycler"
    timeout: 10000
