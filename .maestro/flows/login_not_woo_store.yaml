# Smoke Test: Login - Not a WooCommerce store
# p2: login.not-woo-store
# P2 ref: Login > Not a Woo store (notawoostore.wordpress.com)
#
# Logs into a WordPress site that does NOT have WooCommerce installed.
# Site-admin credentials are preferred, with WP.com credentials used when
# the site routes through WordPress.com authentication instead.
#
# Required env vars:
#   MAESTRO_WOO_NOT_A_WOO_STORE_URL
#   MAESTRO_WOO_NOT_A_WOO_STORE_SITE_ADMIN_USERNAME
#   MAESTRO_WOO_NOT_A_WOO_STORE_SITE_ADMIN_PASSWORD
#
# WP.com env vars (set both or neither). Required when the fixture is hosted
# on wordpress.com; optional for self-hosted sites that expose site credentials:
#   MAESTRO_WOO_NOT_A_WOO_STORE_WPCOM_EMAIL
#   MAESTRO_WOO_NOT_A_WOO_STORE_WPCOM_PASSWORD
appId: com.woocommerce.android
name: "Login - Not a WooCommerce store error"
tags:
  - smoke_core
  - login
---
- launchApp:
    clearState: true

- runFlow:
    file: ../subflows/dismiss_login_carousel.yaml

# Enter store address
- runFlow:
    file: ../subflows/open_site_address_login.yaml

- tapOn:
    id: "input"
- inputText: ${MAESTRO_WOO_NOT_A_WOO_STORE_URL}
- runFlow:
    file: ../subflows/hide_keyboard.yaml
    env:
      KEYBOARD_TARGET_ID: "bottom_button"
- tapOn:
    id: "bottom_button"
    retryTapIfNoChange: true

# Wait for either authentication route. A site can route directly to the
# site-credentials form or expose that path from the WP.com email screen.
- extendedWaitUntil:
    visible: "Username|Email address"
    timeout: 30000

# Prefer site-admin credentials when the app offers that route explicitly.
- runFlow:
    when:
      visible:
        id: "login_site_creds"
    commands:
      - tapOn:
          id: "login_site_creds"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "Username"
          timeout: 15000

# Self-hosted sites show Username and Password on the same screen.
- runFlow:
    when:
      visible: "Username"
    commands:
      - tapOn: "Username"
      - inputText: ${MAESTRO_WOO_NOT_A_WOO_STORE_SITE_ADMIN_USERNAME}
      - tapOn: "Password"
      - inputText: ${MAESTRO_WOO_NOT_A_WOO_STORE_SITE_ADMIN_PASSWORD}
      - tapOn: "Continue"

# Use the resolved WP.com credentials when no site-admin route is available.
- runFlow:
    when:
      visible:
        id: "login_continue_button"
    commands:
      - tapOn:
          id: "input"
      - inputText: ${MAESTRO_WOO_NOT_A_WOO_STORE_WPCOM_EMAIL}
      - runFlow:
          file: ../subflows/hide_keyboard.yaml
          env:
            KEYBOARD_TARGET_ID: "login_continue_button"
      - tapOn:
          id: "login_continue_button"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            id: "login_password_row|login_magic_link_fallback_button"
          timeout: 30000
      # The e-mail field also has the id "input", so scope it to the password row.
      - runFlow:
          when:
            visible:
              id: "login_password_row"
          commands:
            - tapOn:
                id: "input"
                childOf:
                  id: "login_password_row"
            - inputText: ${MAESTRO_WOO_NOT_A_WOO_STORE_WPCOM_PASSWORD}
            - runFlow:
                file: ../subflows/hide_keyboard.yaml
                env:
                  KEYBOARD_TARGET_ID: "bottom_button"
            - tapOn:
                id: "bottom_button"
                retryTapIfNoChange: true
            - extendedWaitUntil:
                visible: ".*not a WooCommerce site.*|.*does not support plugin installation.*|Use username and password instead"
                timeout: 30000
      # WP.com can refuse the email login, before or after the password, and open
      # the magic link screen. Its fallback button opens the WP.com username and
      # password screen, which also takes the email.
      - runFlow:
          when:
            visible:
              id: "login_magic_link_fallback_button"
          commands:
            - tapOn:
                id: "login_magic_link_fallback_button"
            - tapOn:
                id: "input"
                childOf:
                  id: "login_username_row"
            - inputText: ${MAESTRO_WOO_NOT_A_WOO_STORE_WPCOM_EMAIL}
            - tapOn:
                id: "input"
                childOf:
                  id: "login_password_row"
            - inputText: ${MAESTRO_WOO_NOT_A_WOO_STORE_WPCOM_PASSWORD}
            - runFlow:
                file: ../subflows/hide_keyboard.yaml
                env:
                  KEYBOARD_TARGET_ID: "bottom_button"
            - tapOn:
                id: "bottom_button"
                retryTapIfNoChange: true

# Verify the configured WordPress site is rejected specifically because it
# does not have WooCommerce. A WordPress.com site on a plan without plugins gets
# its own message. A Jetpack-account error does not prove this P2 check and must
# fail so the fixture can be repaired.
- extendedWaitUntil:
    visible: ".*not a WooCommerce site.*|.*does not support plugin installation.*"
    timeout: 30000

- assertVisible:
    text: ${STRING_LOGIN_TRY_ANOTHER_ACCOUNT}
    label: "Log in with another account is visible"

- takeScreenshot: login_not_woo_store
