# Reusable login subflow
# Logs into the WooCommerce app with store URL + email + password.
#
# Required env vars: MAESTRO_WOO_JETPACK_STORE_URL, MAESTRO_WOO_WPCOM_EMAIL,
# MAESTRO_WOO_WPCOM_PASSWORD
appId: com.woocommerce.android.dev
---
- launchApp:
    clearState: true

# Wait for app to finish loading after clearState (splash screen can take a while)
- extendedWaitUntil:
    visible: ".*Skip.*|.*Enter your store address.*|.*Log in.*"
    timeout: 30000

# Skip the carousel if it appears
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

# Continue through the QR prologue when present, then enter the store URL.
- runFlow:
    file: open_site_address_login.yaml

- tapOn:
    id: "input"
- inputText: ${MAESTRO_WOO_JETPACK_STORE_URL}
- hideKeyboard
- tapOn:
    id: "bottom_button"
    retryTapIfNoChange: true

# The Google Password Manager autofill sheet can appear on the WP.com email
# screen as a top-most window, hiding login_continue_button from the hierarchy.
# Dismiss it when present; skip silently on builds/AVDs without autofill.
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn:
          text: "No thanks"
          label: "dismiss_autofill_email_screen"

# Enter email address
- extendedWaitUntil:
    visible:
      id: "login_continue_button"
    timeout: 15000
- tapOn:
    id: "input"
- inputText: ${MAESTRO_WOO_WPCOM_EMAIL}
- hideKeyboard
- tapOn:
    id: "login_continue_button"
    retryTapIfNoChange: true

# Dismiss Google Password Manager if it appears
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"

# Handle Magic Link screen - tap "Enter your password instead"
- runFlow:
    when:
      visible:
        id: "login_enter_password"
    commands:
      - tapOn:
          id: "login_enter_password"

# Dismiss Google Password Manager again if it appears on password screen
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"

# Enter password
- extendedWaitUntil:
    visible:
      id: "input"
    timeout: 10000
- tapOn:
    id: "input"
- inputText: ${MAESTRO_WOO_WPCOM_PASSWORD}
- hideKeyboard
- tapOn:
    id: "bottom_button"
    retryTapIfNoChange: true

# Wait for dashboard to load. Google Password Manager may offer to SAVE the
# password as a top-most sheet ("Never"/"Save") that hides the dashboard, and
# the privacy dialog may also appear — accept any of them as "booted".
- extendedWaitUntil:
    visible: ".*My store.*|.*Manage privacy.*|.*Save password.*"
    timeout: 30000

# Dismiss the Google "Save password" sheet if present. Tap "Never" so it does
# not persist credentials or re-prompt on later runs. Must run BEFORE the
# privacy-dialog guard below, whose "Save" match would otherwise collide with
# this sheet's own "Save" button. Skips silently when there is no autofill.
- runFlow:
    when:
      visible: ".*Save password.*"
    commands:
      - tapOn:
          text: "Never"
          label: "dismiss_autofill_save_password"

# Dismiss privacy dialog if it appears
- runFlow:
    when:
      visible: "Save"
    commands:
      - tapOn: "Save"

# Dismiss any store setup or onboarding dialogs
- runFlow:
    when:
      visible: ".*Got it.*"
    commands:
      - tapOn: ".*Got it.*"

# The Google "Save password" sheet can surface a beat after the dashboard
# renders, hiding it again. Dismiss once more if present before verifying.
- runFlow:
    when:
      visible: ".*Save password.*"
    commands:
      - tapOn:
          text: "Never"
          label: "dismiss_autofill_save_password_late"

# Verify dashboard is loaded
- extendedWaitUntil:
    visible: "My store"
    timeout: 10000
